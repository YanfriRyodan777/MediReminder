name: Verificar sintaxis JS

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar cada archivo JavaScript
        run: |
          for f in $(find Frontend -name "*.js") Backend/servidor.js; do
            echo "Revisando $f"
            node --check "$f"
          done